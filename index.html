<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Beloved İrem ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Yıldızlı Arka Plan */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Kart Tasarımı */
        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            position: relative;
        }

        .icon-header {
            font-size: 48px;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #ffb7c5;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 183, 197, 0.5);
            font-weight: 600;
        }

        p.subtitle {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
            font-style: italic;
        }

        .counter-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 15px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .counter-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffb7c5;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .timer {
            display: flex;
            justify-content: space-around;
        }

        .time-box {
            display: flex;
            flex-direction: column;
        }

        .time-number {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .time-label {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .message-box {
            background: rgba(255, 183, 197, 0.08);
            border-left: 3px solid #ffb7c5;
            padding: 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
            color: #e2e8f0;
        }

        /* Sakura (Kiraz Çiçeği Yaprağı) Efekti */
        .sakura {
            position: absolute;
            background: #ffb7c5;
            border-radius: 100% 0 100% 0;
            opacity: 0.7;
            pointer-events: none;
            z-index: 2;
            animation: fall var(--duration) linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) translateX(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(100px);
                opacity: 0.2;
            }
        }

        /* Havai Fişek Tuvali */
        canvas#fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="stars" id="starContainer"></div>
    <canvas id="fireworks"></canvas>

    <div class="card">
        <div class="icon-header">🌸</div>
        <h1>İrem & Me</h1>
        <p class="subtitle">My favorite story began with you...</p>

        <div class="counter-container">
            <div class="counter-title">Time Spent Together</div>
            <div class="timer">
                <div class="time-box"><span class="time-number" id="days">0</span><span class="time-label">DAYS</span></div>
                <div class="time-box"><span class="time-number" id="hours">0</span><span class="time-label">HOURS</span></div>
                <div class="time-box"><span class="time-number" id="minutes">0</span><span class="time-label">MINS</span></div>
                <div class="time-box"><span class="time-number" id="seconds">0</span><span class="time-label">SECS</span></div>
            </div>
        </div>

        <div class="message-box">
            Dearest İrem, thank you for bringing so much light, warmth, and joy into my life. Every second spent with you feels like magic under a sky full of stars. I love you more than words can say! ✨
        </div>
    </div>

    <script>
        // TARİH AYARI: 4 Şubat 2026, Saat 02:51
        // Ay indeksi 0'dan başladığı için Şubat = 1
        const startDate = new Date(2026, 1, 4, 2, 51, 0); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                // Eğer tarih henüz gelmediyse veya test ediliyorsa negatif görünmesin
                document.getElementById('days').innerText = 0;
                document.getElementById('hours').innerText = 0;
                document.getElementById('minutes').innerText = 0;
                document.getElementById('seconds').innerText = 0;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Arka Plan Yıldızları
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starContainer.appendChild(star);
        }

        // Sakura Yaprakları
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 8 + 8;
            sakura.style.width = size + 'px';
            sakura.style.height = (size * 1.2) + 'px';
            sakura.style.setProperty('--duration', (Math.random() * 5 + 5) + 's');
            document.body.appendChild(sakura);

            setTimeout(() => { sakura.remove(); }, 10000);
        }
        setInterval(createSakura, 350);

        // Havai Fişek Efekti
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 6,
                    y: (Math.random() - 0.5) * 6
                };
                this.alpha = 1;
                this.friction = 0.96;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
        }

        function launchFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.5);
            const colors = ['#ffb7c5', '#ff6b81', '#70a1ff', '#eccc68', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
        }

        setInterval(launchFirework, 1500);
        animateFireworks();
    </script>
</body>
</html>
