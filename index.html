<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To my favorite girl <3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #05050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    canvas#fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 90%;
      width: 400px;
    }

    .header-title {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      color: #ff79c6;
      text-shadow: 0 0 10px rgba(255, 121, 198, 0.5);
      font-weight: 600;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 1.5rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .time-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #bd93f9;
    }

    .time-label {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cat-icon {
      font-size: 2.5rem;
      margin-top: 10px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <canvas id="fireworks"></canvas>

  <div class="container">
    <div class="header-title">to my favorite girl &lt;3</div>
    
    <div class="counter-grid">
      <div class="time-box">
        <div class="time-value" id="days">0</div>
        <div class="time-label">Gün</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="hours">0</div>
        <div class="time-label">Saat</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="minutes">0</div>
        <div class="time-label">Dakika</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="seconds">0</div>
        <div class="time-label">Saniye</div>
      </div>
    </div>

    <div class="cat-icon">🐈‍⬛</div>
  </div>

  <script>
    // Canlı Sayaç Mantığı (4 Şubat 2026, 02:51)
    const startDate = new Date('2026-02-04T02:51:00');

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours;
        document.getElementById('minutes').innerText = minutes;
        document.getElementById('seconds').innerText = seconds;
      }
    }

    setInterval(updateCounter, 1000);
    updateCounter();

    // Belirgin ve Yoğun Havai Fişek Efekti
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.velocity = {
          x: Math.cos(angle) * speed,
          y: Math.sin(angle) * speed
        };
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.y += 0.05; // Yerçekimi
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
      }
    }

    let particles = [];
    const colors = ['#ff79c6', '#bd93f9', '#ffb86c', '#50fa7b', '#8be9fd', '#ff5555'];

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.6);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 13, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });

      if (Math.random() < 0.08) {
        createFirework();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
